services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-edu}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # 5433 on the host so it doesn't clash with a local Postgres on 5432.
      # Bound to 127.0.0.1 so the DB is never exposed to the internet on a server.
      - '127.0.0.1:${DB_HOST_PORT:-5433}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: ${POSTGRES_DB:-edu}
      DB_SYNCHRONIZE: 'true'
    ports:
      - '${API_PORT:-3000}:3000'

volumes:
  pgdata:
